# Project-specific tasks for gh-lazydispatch
# Generic tasks are in template.toml (managed by copier template)

[tasks."bench:compare"]
description = "Compare benchmark results (requires old-bench.txt and new-bench.txt)"
run = "benchstat old-bench.txt new-bench.txt"

[tasks."bench:save"]
description = "Run benchmarks and save results to bench.txt"
run = "go test -bench=. -benchmem ./internal/logs/... | tee bench.txt"

[tasks."test:integration"]
description = "Run integration tests only"
run = "go test -v -run TestIntegration ./..."

[tasks."test:record"]
description = "Re-record the gh cassettes against real workflow runs (reads only; needs gh auth)"
run = "GHCASSETTE_RECORD=1 go test ./internal/logs/ -run TestRecorded_ -count=1"

[tasks."test:live"]
description = "Run the live dispatch test against a throwaway GitHub repo (uses Actions minutes)"
run = "./scripts/live-test.sh"

[tasks."test:safety"]
description = "Check for unsafe test patterns"
run = "./scripts/check-test-safety.sh"
